<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>PLSD Classlink</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <meta name="theme-color" content="#00ffa6">
  <link rel="icon" href="/images/classlink.jpg">
  <link href="/styles.css" rel="stylesheet">

  <!-- particles -->
  <script src="/particles.js" defer></script>

  <style>
    body {
      margin: 0;
      min-height: 100vh;
      background: black;
      color: white;
      font-family: Arial, sans-serif;
      overflow: hidden;
    }

    /* PARTICLES LAYER */
    #particles-js {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: -1;
    }

    /* CENTER AREA */
    .credits-wrap {
      position: absolute;
      top: 70px;
      left: 0;
      width: 100%;
      height: calc(100vh - 70px);
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .credits-box {
      background: #2c2c2c;
      padding: 30px 40px;
      border-radius: 12px;
      text-align: center;
      box-shadow: 0 0 25px rgba(0, 255, 166, 0.7);
      max-width: 450px;
      width: 90%;
      transition: 0.2s ease;
    }

    .credits-box:hover {
      box-shadow: 0 0 35px rgba(0, 255, 166, 1);
      transform: translateY(-3px);
    }

    .credits-box h1 {
      margin-top: 0;
      margin-bottom: 10px;
      color: #00ffa6;
    }

    .credits-box p {
      margin: 6px 0;
      opacity: 0.9;
    }

    .credits-box hr {
      border: none;
      height: 1px;
      background: rgba(255,255,255,0.15);
      margin: 15px 0;
    }

    .small-text {
      font-size: 12px;
      opacity: 0.7;
    }

    .back-btn {
      display: inline-block;
      margin-top: 15px;
      padding: 8px 16px;
      font-size: 13px;
      color: black;
      background: #00ffa6;
      border-radius: 8px;
      text-decoration: none;
      font-weight: bold;
      transition: 0.15s ease;
    }

    .back-btn:hover {
      box-shadow: 0 0 10px rgba(0,255,166,0.8);
      transform: translateY(-2px);
    }
  </style>
</head>

<body>

  <!-- PARTICLES -->
  <div id="particles-js"></div>

  <!-- NAVBAR -->
  <header class="topbar">

    <img src="/images/bxsh.jpg" class="logo" alt="logo">

    <nav class="navlinks">
    <a href="/">home</a>
    <a href="credits.html">credits</a>
    <a href="/games.html">play</a>
    <a href="/apps.html">apps</a>
    <a href="/s.html">settings</a>
    </nav>

  </header>

  <!-- CONTENT -->
  <div class="credits-wrap">

    <div class="credits-box">

      <h1>Credits</h1>

      <p>bash — site owner & dev</p>
      <p>froggie1 / UV — proxy system</p>
      <p>zay — settings.html provider</p>
      <p>Vincent Garreau — particles background</p>

      <hr>

      <p class="small-text">
        Made for fun • school project / beta build
      </p>


    </div>

  </div>

  <!-- PARTICLES INIT -->
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      if (window.particlesJS) {
        particlesJS("particles-js", {
          particles: {
            number: { value: 60 },
            color: { value: "#00ffa6" },
            shape: { type: "circle" },
            opacity: { value: 0.5 },
            size: { value: 3 },
            move: { enable: true, speed: 2 }
          }
        });
      }
    });
  </script>

</body>
</html>
