<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Slope</title>

  <style>
    body {
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: black;
    }

    .back-btn {
      position: fixed;
      top: 15px;
      left: 15px;
      padding: 8px 12px;
      background: #00ffa6;
      color: black;
      border-radius: 8px;
      font-weight: bold;
      text-decoration: none;
      z-index: 999;
    }
  </style>
</head>
<body>

  <!-- Back button -->
  <a class="back-btn" href="/games.html">← Back</a>

  <!-- Game iframe -->
  <iframe
    src="https://playslope.pages.dev/play"
    style="width:100vw; height:100vh; border:none;">
  </iframe>

</body>
</html>
