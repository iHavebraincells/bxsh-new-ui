<!DOCTYPE html>
<html lang="en-US">
<head>
    <title>vertex settings</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="icon" href="/images/logo.gif">

    <!-- YOUR PROJECT CSS -->
    <link rel="stylesheet" href="/styles.css">

    <!-- OPTIONAL FONTS -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@100..900&display=swap" rel="stylesheet">

    <!-- YOUR SYSTEM SCRIPTS -->
    <script src="/particles.js" defer></script>
    <script src="/settings.js" defer></script>
    <script src="/notifications.js" defer></script>

    <style>
        body {
            margin: 0;
            background: black;
            color: white;
            font-family: Arial, sans-serif;
        }

        #particles-js {
            position: fixed;
            inset: 0;
            z-index: -1;
        }

        .main {
            padding: 100px 20px 120px;
            max-width: 1000px;
            margin: auto;
        }

        h2 {
            text-align: center;
            color: #00ffa6;
        }

        .settings-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
            gap: 20px;
            margin-top: 30px;
        }

        .setting-card {
            background: #1e1e1e;
            border-radius: 12px;
            padding: 15px;
            box-shadow: 0 0 20px rgba(0,255,166,0.25);
        }

        .setting-title {
            font-weight: bold;
            color: #00ffa6;
            margin-bottom: 5px;
        }

        .setting-desc {
            font-size: 13px;
            opacity: 0.7;
            margin-bottom: 10px;
        }

        .toggle-btn {
            background: #111;
            border: 1px solid #00ffa6;
            color: white;
            padding: 6px 10px;
            border-radius: 6px;
            cursor: pointer;
            margin-right: 5px;
        }

        .toggle-btn:hover {
            background: #00ffa6;
            color: black;
        }

        select, input[type="text"] {
            width: 100%;
            margin-top: 6px;
            padding: 8px;
            border-radius: 6px;
            border: none;
            background: #111;
            color: white;
        }

        .navigation-bar {
            position: fixed;
            bottom: 0;
            width: 100%;
            background: #0b0b0b;
            display: flex;
            justify-content: center;
            padding: 10px;
        }

        .nav-list {
            display: flex;
            gap: 20px;
            list-style: none;
        }

        .nav-list a {
            color: white;
            text-decoration: none;
        }
    </style>
</head>

<body>

<!-- PARTICLES -->
<div id="particles-js"></div>

<!-- SETTINGS -->
<div class="main">
    <h2>settings</h2>

    <div class="settings-grid">

        <div class="setting-card">
            <div class="setting-title">anti-close</div>
            <div class="setting-desc">prevents the site from being closed</div>
            <button class="toggle-btn" id="antiCloseOn">enable</button>
            <button class="toggle-btn" id="antiCloseOff">disable</button>
        </div>

        <div class="setting-card">
            <div class="setting-title">particles</div>
            <div class="setting-desc">background effect</div>
            <button class="toggle-btn" id="particlesOn">enable</button>
            <button class="toggle-btn" id="particlesOff">disable</button>
            <input type="color" id="particleColor" value="#00ffa6">
        </div>

        <div class="setting-card">
            <div class="setting-title">tab cloak</div>
            <div class="setting-desc">fake tab title</div>
            <select id="cloak">
                <option value="none">None</option>
                <option value="google">Google</option>
                <option value="drive">Google Drive</option>
                <option value="custom">Custom</option>
            </select>
        </div>

        <div class="setting-card">
            <div class="setting-title">panic key</div>
            <div class="setting-desc">quick escape button</div>
            <select id="panicSite">
                <option value="https://google.com">Google</option>
                <option value="https://classroom.google.com">Classroom</option>
            </select>
            <button class="toggle-btn" id="bindPanicKey">bind key</button>
            <div id="panicLabel">panic key: none</div>
        </div>

        <div class="setting-card">
            <div class="setting-title">notifications</div>
            <div class="setting-desc">popup alerts</div>
            <button class="toggle-btn" id="notificationsOn">enable</button>
            <button class="toggle-btn" id="notificationsOff">disable</button>
        </div>

        <div class="setting-card">
            <div class="setting-title">about:blank cloak</div>
            <div class="setting-desc">opens in hidden tab</div>
            <button class="toggle-btn" id="blankCloak">cloak</button>
        </div>

    </div>
</div>

<!-- NAV -->
<div class="navigation-bar">
    <ul class="nav-list">
        <li><a href="/">home</a></li>
        <li><a href="/games.html">games</a></li>
        <li><a href="/apps.html">apps</a></li>
        <li><a href="/settings.html">settings</a></li>
    </ul>
</div>

</body>
</html>
