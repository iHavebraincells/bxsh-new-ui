<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>PLSD Classlink</title>

  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#00ffa6">

  <link rel="icon" href="/images/bxsh.jpg">
  <link href="/styles.css" rel="stylesheet">

  <script src="/particles.js" defer></script>

  <style>
    body {
      margin: 0;
      min-height: 100vh;
      background: black;
      color: white;
      font-family: Arial, sans-serif;
      overflow-x: hidden;
    }

    /* PARTICLES FIX */
    #particles-js {
      position: fixed;
      inset: 0;
      z-index: -1;
    }

    /* PAGE WRAP */
    .settings-page {
      margin-top: 90px;
      display: flex;
      justify-content: center;
    }

    .settings-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 20px;
      max-width: 1000px;
      width: 90%;
    }

    .setting-card {
      background: #2c2c2c;
      padding: 18px;
      border-radius: 12px;
      box-shadow: 0 0 20px rgba(0, 255, 166, 0.4);
      transition: 0.2s;
    }

    .setting-card:hover {
      transform: translateY(-3px);
      box-shadow: 0 0 30px rgba(0, 255, 166, 0.8);
    }

    .setting-title {
      font-weight: bold;
      color: #00ffa6;
      margin-bottom: 6px;
    }

    .setting-desc {
      font-size: 13px;
      opacity: 0.8;
      margin-bottom: 10px;
    }

    .setting-actions button {
      background: black;
      border: 1px solid #00ffa6;
      color: white;
      padding: 6px 10px;
      border-radius: 6px;
      cursor: pointer;
      margin-right: 5px;
    }

    .setting-actions button:hover {
      box-shadow: 0 0 10px #00ffa6;
    }

    select, input {
      width: 100%;
      margin-top: 6px;
      padding: 8px;
      border-radius: 6px;
      border: none;
      background: #111;
      color: white;
      outline: none;
    }
  </style>
</head>

<body>

<div id="particles-js"></div>

<!-- NAVBAR (your existing system) -->
<header class="topbar">
  <img src="/images/logo.gif" class="logo" alt="logo">

  <nav class="navlinks">
    <a href="/">home</a>
    <a href="/credits.html">cred</a>
    <a href="/games.html">play</a>
    <a href="/apps.html">apps</a>
    <a href="/s.html">settings</a>
  </nav>
</header>

<!-- SETTINGS -->
<div class="settings-page">

  <div class="settings-grid">

    <div class="setting-card">
      <div class="setting-title">particles</div>
      <div class="setting-desc">toggle background effects</div>
      <div class="setting-actions">
        <button>enable</button>
        <button>disable</button>
      </div>
    </div>

    <div class="setting-card">
      <div class="setting-title">tab cloak</div>
      <div class="setting-desc">fake tab title + icon</div>
      <select>
        <option>None</option>
        <option>Google</option>
        <option>Drive</option>
      </select>
    </div>

    <div class="setting-card">
      <div class="setting-title">panic key</div>
      <div class="setting-desc">instant escape key</div>
      <input placeholder="set panic URL">
    </div>

    <div class="setting-card">
      <div class="setting-title">notifications</div>
      <div class="setting-desc">toggle alerts</div>
      <div class="setting-actions">
        <button>on</button>
        <button>off</button>
      </div>
    </div>

  </div>

</div>


<script>
document.addEventListener("DOMContentLoaded", () => {

  // PARTICLES TOGGLE
  document.querySelector("#particlesOn")?.addEventListener("click", () => {
    localStorage.setItem("particles", "true");
    location.reload();
  });

  document.querySelector("#particlesOff")?.addEventListener("click", () => {
    localStorage.setItem("particles", "false");
    location.reload();
  });

  // PARTICLE COLOR
  document.querySelector("#particleColor")?.addEventListener("input", (e) => {
    localStorage.setItem("particleColor", e.target.value);
  });

  // CLOAK
  document.querySelector("#cloak")?.addEventListener("change", (e) => {
    localStorage.setItem("cloak", e.target.value);
    location.reload();
  });

  // PANIC URL
  document.querySelector("#panicSite")?.addEventListener("change", (e) => {
    localStorage.setItem("panicURL", e.target.value);
  });

  // NOTIFICATIONS
  document.querySelector("#notificationsOn")?.addEventListener("click", () => {
    localStorage.setItem("notifications", "true");
  });

  document.querySelector("#notificationsOff")?.addEventListener("click", () => {
    localStorage.setItem("notifications", "false");
  });

});
</script>


  
</body>
</html>
