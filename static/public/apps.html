<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Apps</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

<meta name="theme-color" content="#00ffa6">
<link rel="icon" href="/images/logo.gif">
<link rel="stylesheet" href="/styles.css">
<script src="/particles.js" defer></script>

  <style>
    body {
      margin: 0;
      background: black;
      color: white;
      font-family: Arial, sans-serif;
      overflow: hidden;
    }

    /* PAGE AREA */
    .apps-wrap {
      position: absolute;
      top: 70px;
      left: 0;
      width: 100%;
      height: calc(100vh - 70px);
      overflow-y: auto;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding: 40px;
    }

    .app-container {
      display: flex;
      gap: 30px;
      justify-content: center;
      align-items: flex-start;
      flex-wrap: wrap;
      max-width: 1200px;
    }

    .app-box {
      background: #2c2c2c;
      padding: 20px;
      border-radius: 12px;
      text-align: center;
      box-shadow: 0 0 25px rgba(0, 255, 166, 0.7);
      width: 200px;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
      cursor: pointer;
    }

    .app-box:hover {
      transform: translateY(-5px);
      box-shadow: 0 0 35px rgba(0, 255, 166, 1);
    }

    .app-button {
      position: relative;
    }

    .app-button img {
      width: 100%;
      border-radius: 10px;
      display: block;
    }

    .overlay-text {
      position: absolute;
      bottom: 10px;
      left: 10px;
      font-weight: bold;
      text-transform: uppercase;
      text-shadow: 0 0 8px rgba(0,0,0,0.8);
      color: white;
      font-size: 14px;
    }

    /* BACK BUTTON */
    .linkmaker {
      margin-top: 25px;
      padding: 8px 18px;
      font-size: 14px;
      color: black;
      background: #00ffa6;
      border-radius: 10px;
      text-decoration: none;
      font-weight: bold;
      box-shadow: 0 0 10px rgba(0, 255, 166, 0.6);
      transition: transform 0.15s ease, box-shadow 0.15s ease;
      display: inline-block;
    }

    .linkmaker:hover {
      transform: translateY(-2px);
      box-shadow: 0 0 18px rgba(0, 255, 166, 1);
    }

  </style>
</head>

<body>

  <!-- NAVBAR (match index.html exactly) -->
  <header class="topbar">

    <img src="/images/logo.gif" class="logo" alt="logo">

    <nav class="navlinks">
      <a href="/">home</a>
      <a href="credits.html">cred</a>
      <a href="/games.html">play</a>
      <a href="/apps.html">apps</a>
    </nav>

  </header>

  <!-- APPS PAGE -->
  <div class="apps-wrap">

    <div>

      <div class="app-container">

        <!-- CODE EDITOR -->
        <div class="app-box" onclick="openApp('/code.html')">
          <div class="app-button">
            <img src="images/code.jpg" alt="Code Editor">
            <div class="overlay-text">Code Editor</div>
          </div>
        </div>

      </div>

      <!-- BACK HOME -->
      <div style="text-align:center; margin-top:30px;">
        <a href="/" class="linkmaker">← Back Home</a>
      </div>

    </div>

  </div>

  <script>
    function openApp(url) {
      window.location.href = url;
    }
  </script>

</body>
</html>
