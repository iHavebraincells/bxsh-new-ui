<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PLSD Classlink</title>
  <meta name="theme-color" content="#00ffa6">
  <link rel="icon" href="/images/classlink.jpg">
  <link href="/styles.css" rel="stylesheet">

  <!-- particles -->
  <script src="/particles.js" defer></script>

  <style>
    body {
      margin: 0;
      background: black;
      color: white;
      font-family: Arial, sans-serif;
      overflow: hidden;
    }

    /* PARTICLES LAYER */
    #particles-js {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: -1;
    }

    /* PAGE WRAP */
    .apps-wrap {
      position: absolute;
      top: 70px;
      left: 0;
      width: 100%;
      height: calc(100vh - 70px);
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding: 40px;
      overflow-y: auto;
    }

    .app-container {
      display: flex;
      gap: 30px;
      justify-content: center;
      flex-wrap: wrap;
      max-width: 1200px;
    }

    .app-box {
      background: #2c2c2c;
      padding: 20px;
      border-radius: 12px;
      text-align: center;
      box-shadow: 0 0 25px rgba(0, 255, 166, 0.7);
      width: 200px;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
      cursor: pointer;
    }

    .app-box:hover {
      transform: translateY(-5px);
      box-shadow: 0 0 35px rgba(0, 255, 166, 1);
    }

    .app-button {
      position: relative;
    }

    .app-button img {
      width: 100%;
      border-radius: 10px;
      display: block;
    }

    .overlay-text {
      position: absolute;
      bottom: 10px;
      left: 10px;
      font-weight: bold;
      text-transform: uppercase;
      text-shadow: 0 0 8px rgba(0,0,0,0.8);
      color: white;
      font-size: 14px;
    }

    .linkmaker {
      margin-top: 20px;
      padding: 8px 18px;
      font-size: 14px;
      color: black;
      background: #00ffa6;
      border-radius: 10px;
      text-decoration: none;
      font-weight: bold;
      box-shadow: 0 0 10px rgba(0, 255, 166, 0.6);
      transition: 0.15s ease;
    }

    .linkmaker:hover {
      transform: translateY(-2px);
      box-shadow: 0 0 18px rgba(0, 255, 166, 1);
    }

    /* APP EMBED */
    #app-view {
      display: none;
      position: fixed;
      top: 60px;
      left: 0;
      right: 0;
      bottom: 0;
      z-index: 50;
      background: black;
      flex-direction: column;
    }

    #app-view.active {
      display: flex;
    }

    #app-bar {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 6px 16px;
      background: #1a1a1a;
      border-bottom: 1px solid #333;
      flex-shrink: 0;
    }

    #btn-back {
      background: #2c2c2c;
      border: none;
      color: white;
      padding: 6px 16px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 13px;
      box-shadow: 0 0 10px rgba(0,255,166,0.4);
      transition: 0.2s;
    }

    #btn-back:hover {
      box-shadow: 0 0 18px rgba(0,255,166,0.9);
    }

    #btn-reload {
      background: #2c2c2c;
      border: none;
      color: white;
      padding: 6px 14px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 13px;
      box-shadow: 0 0 10px rgba(0,255,166,0.4);
      transition: 0.2s;
    }

    #btn-reload:hover {
      box-shadow: 0 0 18px rgba(0,255,166,0.9);
    }

    #app-title {
      font-size: 13px;
      font-weight: bold;
      text-transform: uppercase;
      color: #00ffa6;
      text-shadow: 0 0 8px rgba(0,255,166,0.6);
    }

    #app-frame {
      flex: 1;
      border: none;
      width: 100%;
      background: black;
    }
  </style>
</head>

<body>

  <!-- PARTICLES -->
  <div id="particles-js"></div>

  <!-- NAVBAR -->
  <header class="topbar">
    <img src="/images/bxsh.jpg" class="logo" alt="logo">
    <nav class="navlinks">
    <a href="/">home</a>
    <a href="credits.html">credits</a>
    <a href="/games.html">play</a>
    <a href="/apps.html">apps</a>
    <a href="/s.html">settings</a>
    </nav>
  </header>

  <!-- APP EMBED VIEW (sits below navbar) -->
  <div id="app-view">
    <div id="app-bar">
      <button id="btn-back" onclick="closeApp()">← Back to Apps</button>
      <button id="btn-reload" onclick="reloadApp()">↺ Reload</button>
      <span id="app-title"></span>
    </div>
    <iframe id="app-frame" allowfullscreen></iframe>
  </div>

  <!-- CONTENT -->
  <div class="apps-wrap" id="apps-wrap">
    <div class="app-container">

      <!-- CODE EDITOR -->
      <div class="app-box" onclick="openApp('/code.html', 'Code Editor')">
        <div class="app-button">
          <img src="images/code.jpg" alt="app">
          <div class="overlay-text">Code Editor</div>
        </div>
      </div>

      <!-- SANDSTONE -->
      <div class="app-box" onclick="openApp('/ss.html', 'SandStone')">
        <div class="app-button">
          <img src="images/ss.jpg" alt="app">
          <div class="overlay-text">SandStone</div>
        </div>
      </div>

      <!-- SOUNDBOARD -->
      <div class="app-box" onclick="openApp('/sb.html', 'SoundBoard')">
        <div class="app-button">
          <img src="images/sb.jpg" alt="app">
          <div class="overlay-text">SoundBoard</div>
        </div>
      </div>

      <!-- DONT LECTURE -->
      <div class="app-box" onclick="openApp('/dyl.html', 'Dont You Lecture Me')">
        <div class="app-button">
          <img src="images/dyl.jpg" alt="app">
          <div class="overlay-text">Dont You Lecture Me</div>
        </div>
      </div>

      <!-- EMULATOR -->
      <div class="app-box" onclick="openApp('/emjs.html', 'Emulator JS')">
        <div class="app-button">
          <img src="images/emjs.jpg" alt="app">
          <div class="overlay-text">Emulater JS</div>
        </div>
      </div>

    </div>
  </div>

  <script>
    document.addEventListener("DOMContentLoaded", () => {
      if (window.particlesJS) {
        particlesJS("particles-js", {
          particles: {
            number: { value: 60 },
            color: { value: "#00ffa6" },
            shape: { type: "circle" },
            opacity: { value: 0.5 },
            size: { value: 3 },
            move: { enable: true, speed: 2 }
          }
        });
      }
    });

    function openApp(url, name) {
      document.getElementById("app-frame").src = url;
      document.getElementById("app-title").textContent = name;
      document.getElementById("app-view").classList.add("active");
    }

    function closeApp() {
      document.getElementById("app-view").classList.remove("active");
      document.getElementById("app-frame").src = "";
    }

    function reloadApp() {
      const frame = document.getElementById("app-frame");
      frame.src = frame.src;
    }
  </script>

</body>
</html>
