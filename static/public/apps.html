<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>apps</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <meta name="theme-color" content="#00ffa6">
  <link rel="icon" href="/images/logo.gif">
  <link href="/styles.css" rel="stylesheet">

  <!-- particles -->
  <script src="/particles.js" defer></script>

  <style>
    body {
      margin: 0;
      background: black;
      color: white;
      font-family: Arial, sans-serif;
      overflow: hidden;
    }

    /* PARTICLES LAYER */
    #particles-js {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: -1;
    }

    /* PAGE WRAP */
    .apps-wrap {
      position: absolute;
      top: 70px;
      left: 0;
      width: 100%;
      height: calc(100vh - 70px);
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding: 40px;
      overflow-y: auto;
    }

    .app-container {
      display: flex;
      gap: 30px;
      justify-content: center;
      flex-wrap: wrap;
      max-width: 1200px;
    }

    .app-box {
      background: #2c2c2c;
      padding: 20px;
      border-radius: 12px;
      text-align: center;
      box-shadow: 0 0 25px rgba(0, 255, 166, 0.7);
      width: 200px;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
      cursor: pointer;
    }

    .app-box:hover {
      transform: translateY(-5px);
      box-shadow: 0 0 35px rgba(0, 255, 166, 1);
    }

    .app-button {
      position: relative;
    }

    .app-button img {
      width: 100%;
      border-radius: 10px;
      display: block;
    }

    .overlay-text {
      position: absolute;
      bottom: 10px;
      left: 10px;
      font-weight: bold;
      text-transform: uppercase;
      text-shadow: 0 0 8px rgba(0,0,0,0.8);
      color: white;
      font-size: 14px;
    }

    .linkmaker {
      margin-top: 20px;
      padding: 8px 18px;
      font-size: 14px;
      color: black;
      background: #00ffa6;
      border-radius: 10px;
      text-decoration: none;
      font-weight: bold;
      box-shadow: 0 0 10px rgba(0, 255, 166, 0.6);
      transition: 0.15s ease;
    }

    .linkmaker:hover {
      transform: translateY(-2px);
      box-shadow: 0 0 18px rgba(0, 255, 166, 1);
    }
  </style>
</head>

<body>

  <!-- PARTICLES -->
  <div id="particles-js"></div>

  <!-- NAVBAR -->
  <header class="topbar">

    <img src="/images/logo.gif" class="logo" alt="logo">

    <nav class="navlinks">
      <a href="/">home</a>
      <a href="credits.html">cred</a>
      <a href="/games.html">play</a>
      <a href="/apps.html">apps</a>
    </nav>

  </header>

  <!-- CONTENT -->
  <div class="apps-wrap">

    <div class="app-container">

      <!-- CODE EDITOR -->
      <div class="app-box" onclick="openApp('/code.html')">
        <div class="app-button">
          <img src="images/code.jpg" alt="app">
          <div class="overlay-text">Code Editor</div>
        </div>
      </div>

    </div>

  </div>

  <!-- INIT PARTICLES (IMPORTANT) -->
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      if (window.particlesJS) {
        particlesJS("particles-js", {
          particles: {
            number: { value: 60 },
            color: { value: "#00ffa6" },
            shape: { type: "circle" },
            opacity: { value: 0.5 },
            size: { value: 3 },
            move: { enable: true, speed: 2 }
          }
        });
      }
    });

    function openApp(url) {
      window.location.href = url;
    }
  </script>

</body>
</html>
