<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Games</title>

  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#00ffa6">

<link rel="icon" href="/images/bxsh.jpg">
  <link href="/styles.css" rel="stylesheet">

  <script src="/particles.js" defer></script>

  <style>
    body {
      margin: 0;
      min-height: 100vh;
      background: black;
      color: white;
      font-family: Arial, sans-serif;
      overflow-x: hidden;
    }

    /* PARTICLES */
    #particles-js {
      position: fixed;
      inset: 0;
      z-index: -1;
    }

    /* SEARCH BAR */
    #gameSearch {
      width: 300px;
      padding: 10px 14px;
      margin: 110px auto 20px auto;
      display: block;
      border-radius: 10px;
      border: none;
      outline: none;
      background: #2c2c2c;
      color: white;
      box-shadow: 0 0 15px rgba(0, 255, 166, 0.4);
    }

    /* GRID */
    .games-container {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 25px;
      max-width: 1200px;
      margin: auto;
      padding: 20px;
    }

    .game-box {
      background: #2c2c2c;
      width: 200px;
      padding: 15px;
      border-radius: 12px;
      text-align: center;
      box-shadow: 0 0 25px rgba(0, 255, 166, 0.6);
      transition: 0.2s ease;
      cursor: pointer;
    }

    .game-box:hover {
      transform: translateY(-5px);
      box-shadow: 0 0 35px rgba(0, 255, 166, 1);
    }

    .game-button {
      position: relative;
    }

    .game-button img {
      width: 100%;
      border-radius: 10px;
      display: block;
    }

    .overlay-text {
      position: absolute;
      bottom: 8px;
      left: 8px;
      font-weight: bold;
      font-size: 13px;
      text-transform: uppercase;
      text-shadow: 0 0 8px rgba(0,0,0,0.8);
      color: white;
    }

    /* NAVBAR (assumes styles.css handles layout) */

    /* GAME EMBED */
    #game-view {
      display: none;
      position: fixed;
      top: 60px;
      left: 0;
      right: 0;
      bottom: 0;
      z-index: 50;
      background: black;
      flex-direction: column;
    }

    #game-view.active {
      display: flex;
    }

    #game-bar {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 6px 16px;
      background: #1a1a1a;
      border-bottom: 1px solid #333;
      flex-shrink: 0;
    }

    #btn-back {
      background: #2c2c2c;
      border: none;
      color: white;
      padding: 6px 16px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 13px;
      box-shadow: 0 0 10px rgba(0,255,166,0.4);
      transition: 0.2s;
    }

    #btn-back:hover {
      box-shadow: 0 0 18px rgba(0,255,166,0.9);
    }

    #btn-reload {
      background: #2c2c2c;
      border: none;
      color: white;
      padding: 6px 14px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 13px;
      box-shadow: 0 0 10px rgba(0,255,166,0.4);
      transition: 0.2s;
    }

    #btn-reload:hover {
      box-shadow: 0 0 18px rgba(0,255,166,0.9);
    }

    #game-title {
      font-size: 13px;
      font-weight: bold;
      text-transform: uppercase;
      color: #00ffa6;
      text-shadow: 0 0 8px rgba(0,255,166,0.6);
    }

    #game-frame {
      flex: 1;
      border: none;
      width: 100%;
      background: black;
    }
  </style>
</head>

<body>

<!-- PARTICLES -->
<div id="particles-js"></div>

<!-- NAVBAR -->
<header class="topbar">
  <img src="/images/bxsh.jpg" class="logo" alt="logo">

  <nav class="navlinks">
    <a href="/">home</a>
    <a href="/credits.html">cred</a>
    <a href="/games.html">play</a>
    <a href="/apps.html">apps</a>
  </nav>
</header>

<!-- GAME EMBED VIEW (sits below navbar, above everything else) -->
<div id="game-view">
  <div id="game-bar">
    <span id="game-title"></span>
  </div>
  <iframe id="game-frame" allowfullscreen></iframe>
</div>

<!-- SEARCH -->
<input id="gameSearch" type="text" placeholder="Search games...">

<!-- GAME GRID -->
<div class="games-container" id="games"></div>

<script>
const games = [
  { name: "Slope", img: "images/slope.jpg", link: "/slope.html" },
  { name: "Geometry Dash", img: "images/geod.jpg", link: "/geod.html" },
  { name: "Minecraft", img: "images/minecraft.jpg", link: "/minecraft.html" },
  { name: "Super Mario 64", img: "images/supermario.jpg", link: "/superMARIO64.html" },
  { name: "1v1.lol", img: "images/1v1.jpg", link: "/1v1.html" },
  { name: "Baldi Ultra", img: "images/bdcp.jpg", link: "/bdcp.html" },
  { name: "FNF", img: "images/fnf.jpg", link: "/fnf.html" },
  { name: "-b", img: "images/b.jpg", link: "/b.html" },
  { name: "Five Night's At Epstines", img: "images/fnaE.jpg", link: "/fnaE.html" },
  { name: "Drift Boss", img: "images/db.jpg", link: "/db.html" },
  { name: "Cluster Rush", img: "images/cr.jpg", link: "/cluster.html" },
  { name: "Baldi's Basic's +", img: "images/baldi.jpg", link: "/baldi.html" },
  { name: "Basket Battle", img: "images/bsb.jpg", link: "/basketbattle.html" },
  { name: "Basket Bro's", img: "images/bb.jpg", link: "/basketbros.html" },
  { name: "Bloxorz", img: "images/bx.jpg", link: "/bloxorz.html" },
  { name: "Bridge Race", img: "images/br.jpg", link: "/bridgerace.html" },
  { name: "Candy Crush", img: "images/cc.jpg", link: "/candy.html" },
  { name: "Clash Of Viking's", img: "images/cv.jpg", link: "/clash.html" },
  { name: "Cut The Rope", img: "images/ctr.jpg", link: "/cut.html" },
  { name: "Death Run", img: "images/death.jpg", link: "/deathrun.html" },
  { name: "Five Night's At Winstons", img: "images/fnaW.jpg", link: "/fnaW.html" },
  { name: "School Boy Runaway", img: "images/school.jpg", link: "/school.html" }
];

const container = document.getElementById("games");
const search = document.getElementById("gameSearch");

function render(filter = "") {
  container.innerHTML = "";

  games
    .filter(g => g.name.toLowerCase().includes(filter.toLowerCase()))
    .forEach(g => {
      const box = document.createElement("div");
      box.className = "game-box";

      box.innerHTML = `
        <div class="game-button">
          <img src="${g.img}" alt="${g.name}">
          <div class="overlay-text">${g.name}</div>
        </div>
      `;

      box.addEventListener("click", () => openGame(g.link, g.name));
      container.appendChild(box);
    });
}

render("");

search.addEventListener("input", e => {
  render(e.target.value);
});

function openGame(url, name) {
  document.getElementById("game-frame").src = url;
  document.getElementById("game-title").textContent = name;
  document.getElementById("game-view").classList.add("active");
}

function closeGame() {
  document.getElementById("game-view").classList.remove("active");
  document.getElementById("game-frame").src = "";
}

function reloadGame() {
  const frame = document.getElementById("game-frame");
  frame.src = frame.src;
}

/* PARTICLES INIT (safe fallback) */
window.addEventListener("DOMContentLoaded", () => {
  if (window.particlesJS) {
    particlesJS("particles-js", {
      particles: {
        number: { value: 60 },
        color: { value: "#00ffa6" },
        shape: { type: "circle" },
        opacity: { value: 0.5 },
        size: { value: 3 },
        move: { speed: 2 }
      }
    });
  }
});
</script>

</body>
</html>
