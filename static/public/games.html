<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Games</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <meta name="theme-color" content="#00ffa6">
  <link rel="icon" href="/images/logo.gif">
  <link href="/styles.css" rel="stylesheet">

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #000;
      color: white;
      font-family: Arial, sans-serif;
      overflow: hidden;
    }

    /* TOP BAR */

    .topbar {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 60px;
      background: #111;
      border-bottom: 1px solid #222;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 20px;
      z-index: 9999;
    }

    .logo {
      color: #00ffa6;
      font-size: 22px;
      font-weight: bold;
    }

    .top-buttons {
      display: flex;
      gap: 10px;
    }

    .nav-btn {
      background: #00ffa6;
      color: black;
      border: none;
      padding: 8px 16px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: bold;
      transition: 0.15s ease;
    }

    .nav-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 0 12px rgba(0,255,166,0.8);
    }

    /* MENU PAGE */

    #menuPage {
      position: absolute;
      top: 60px;
      left: 0;
      width: 100%;
      height: calc(100vh - 60px);
      overflow-y: auto;
      padding: 40px;
    }

    .games-container {
      display: flex;
      gap: 30px;
      justify-content: center;
      align-items: flex-start;
      flex-wrap: wrap;
      max-width: 1400px;
      margin: auto;
    }

    .game-box {
      background: #1d1d1d;
      width: 220px;
      border-radius: 14px;
      overflow: hidden;
      box-shadow: 0 0 20px rgba(0,255,166,0.5);
      transition: 0.2s ease;
    }

    .game-box:hover {
      transform: translateY(-6px);
      box-shadow: 0 0 30px rgba(0,255,166,1);
    }

    .game-button {
      cursor: pointer;
      position: relative;
    }

    .game-button img {
      width: 100%;
      height: 140px;
      object-fit: cover;
      display: block;
    }

    .overlay-text {
      position: absolute;
      bottom: 10px;
      left: 10px;
      right: 10px;
      color: white;
      font-weight: bold;
      text-transform: uppercase;
      text-shadow: 0 0 10px black;
      font-size: 14px;
    }

    /* GAME PAGE */

    #gamePage {
      display: none;
      position: fixed;
      top: 60px;
      left: 0;
      width: 100%;
      height: calc(100vh - 60px);
      background: black;
    }

    #gameFrame {
      width: 100%;
      height: 100%;
      border: none;
      background: black;
    }

    /* SCROLLBAR */

    ::-webkit-scrollbar {
      width: 8px;
    }

    ::-webkit-scrollbar-thumb {
      background: #00ffa6;
      border-radius: 10px;
    }
  </style>
</head>

<body>

  <!-- TOPBAR -->

  <div class="topbar">

    <div class="logo">
      bxsh.shop
    </div>

    <div class="top-buttons">
      <button class="nav-btn" onclick="closeGame()">
        Home
      </button>
    </div>

  </div>

  <!-- MENU -->

  <div id="menuPage">

    <div class="games-container">

      <!-- SLOPE -->

      <div class="game-box">
        <div class="game-button" onclick="loadGame('/slope.html')">
          <img src="images/slope.jpg" alt="Slope">
          <div class="overlay-text">Slope</div>
        </div>
      </div>

      <!-- MARIO -->

      <div class="game-box">
        <div class="game-button" onclick="loadGame('/superMARIO64.html')">
          <img src="images/supermario.jpg" alt="Mario">
          <div class="overlay-text">Super Mario 64</div>
        </div>
      </div>

      <!-- MINECRAFT -->

      <div class="game-box">
        <div class="game-button" onclick="loadGame('/minecraft.html')">
          <img src="images/minecraft.jpg" alt="Minecraft">
          <div class="overlay-text">Minecraft</div>
        </div>
      </div>

      <!-- 1V1 -->

      <div class="game-box">
        <div class="game-button" onclick="loadGame('/1v1.html')">
          <img src="images/1v1.jpg" alt="1v1">
          <div class="overlay-text">1v1.lol</div>
        </div>
      </div>

      <!-- BALDI -->

      <div class="game-box">
        <div class="game-button" onclick="loadGame('/bdcp.html')">
          <img src="images/bdcp.jpg" alt="Baldi">
          <div class="overlay-text">Baldi Basics Ultra Decompile</div>
        </div>
      </div>

      <!-- FNF -->

      <div class="game-box">
        <div class="game-button" onclick="loadGame('/fnf.html')">
          <img src="images/fnf.jpg" alt="FNF">
          <div class="overlay-text">Friday Night Funkin</div>
        </div>
      </div>

      <!-- -B -->

      <div class="game-box">
        <div class="game-button" onclick="loadGame('/b.html')">
          <img src="images/b.jpg" alt="-b">
          <div class="overlay-text">-b</div>
        </div>
      </div>

    </div>

  </div>

  <!-- GAME FRAME -->

  <div id="gamePage">

    <iframe
      id="gameFrame"
      allowfullscreen
      tabindex="0">
    </iframe>

  </div>

  <!-- SCRIPT -->

  <script>
    function loadGame(gamePath) {

      document.getElementById("menuPage").style.display = "none";

      document.getElementById("gamePage").style.display = "block";

      document.getElementById("gameFrame").src = gamePath;
    }

    function closeGame() {

      document.getElementById("menuPage").style.display = "block";

      document.getElementById("gamePage").style.display = "none";

      document.getElementById("gameFrame").src = "";
    }
  </script>

</body>
</html>
