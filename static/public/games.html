<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Games</title>

  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#00ffa6">

  <link rel="icon" href="/images/logo.gif">
  <link href="/styles.css" rel="stylesheet">

  <script src="/particles.js" defer></script>

  <style>
    body {
      margin: 0;
      min-height: 100vh;
      background: black;
      color: white;
      font-family: Arial, sans-serif;
      overflow-x: hidden;
    }

    /* PARTICLES */
    #particles-js {
      position: fixed;
      inset: 0;
      z-index: -1;
    }

    /* SEARCH BAR */
    #gameSearch {
      width: 300px;
      padding: 10px 14px;
      margin: 110px auto 20px auto;
      display: block;
      border-radius: 10px;
      border: none;
      outline: none;
      background: #2c2c2c;
      color: white;
      box-shadow: 0 0 15px rgba(0, 255, 166, 0.4);
    }

    /* GRID */
    .games-container {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 25px;
      max-width: 1200px;
      margin: auto;
      padding: 20px;
    }

    .game-box {
      background: #2c2c2c;
      width: 200px;
      padding: 15px;
      border-radius: 12px;
      text-align: center;
      box-shadow: 0 0 25px rgba(0, 255, 166, 0.6);
      transition: 0.2s ease;
      cursor: pointer;
    }

    .game-box:hover {
      transform: translateY(-5px);
      box-shadow: 0 0 35px rgba(0, 255, 166, 1);
    }

    .game-button {
      position: relative;
    }

    .game-button img {
      width: 100%;
      border-radius: 10px;
      display: block;
    }

    .overlay-text {
      position: absolute;
      bottom: 8px;
      left: 8px;
      font-weight: bold;
      font-size: 13px;
      text-transform: uppercase;
      text-shadow: 0 0 8px rgba(0,0,0,0.8);
      color: white;
    }

    /* NAVBAR (assumes styles.css handles layout) */
  </style>
</head>

<body>

<!-- PARTICLES -->
<div id="particles-js"></div>

<!-- NAVBAR -->
<header class="topbar">
  <img src="/images/logo.gif" class="logo" alt="logo">

  <nav class="navlinks">
    <a href="/">home</a>
    <a href="/credits.html">cred</a>
    <a href="/games.html">play</a>
    <a href="/apps.html">apps</a>
  </nav>
</header>

<!-- SEARCH -->
<input id="gameSearch" type="text" placeholder="Search games...">

<!-- GAME GRID -->
<div class="games-container" id="games"></div>

<script>
const games = [
  { name: "Slope", img: "images/slope.jpg", link: "/slope.html" },
  { name: "Minecraft", img: "images/minecraft.jpg", link: "/minecraft.html" },
  { name: "Super Mario 64", img: "images/supermario.jpg", link: "/superMARIO64.html" },
  { name: "1v1.lol", img: "images/1v1.jpg", link: "/1v1.html" },
  { name: "Baldi Ultra", img: "images/bdcp.jpg", link: "/bdcp.html" },
  { name: "FNF", img: "images/fnf.jpg", link: "/fnf.html" },
  { name: "-b", img: "images/b.jpg", link: "/b.html" },
  { name: "Five Night's At Epstines", img: "images/fnaE.jpg", link: "/fnaE.html" }
];

const container = document.getElementById("games");
const search = document.getElementById("gameSearch");

function render(filter = "") {
  container.innerHTML = "";

  games
    .filter(g => g.name.toLowerCase().includes(filter.toLowerCase()))
    .forEach(g => {
      const box = document.createElement("div");
      box.className = "game-box";

      box.innerHTML = `
        <a href="${g.link}">
          <div class="game-button">
            <img src="${g.img}" alt="${g.name}">
            <div class="overlay-text">${g.name}</div>
          </div>
        </a>
      `;

      container.appendChild(box);
    });
}

render("");

search.addEventListener("input", e => {
  render(e.target.value);
});

/* PARTICLES INIT (safe fallback) */
window.addEventListener("DOMContentLoaded", () => {
  if (window.particlesJS) {
    particlesJS("particles-js", {
      particles: {
        number: { value: 60 },
        color: { value: "#00ffa6" },
        shape: { type: "circle" },
        opacity: { value: 0.5 },
        size: { value: 3 },
        move: { speed: 2 }
      }
    });
  }
});
</script>

</body>
</html>
