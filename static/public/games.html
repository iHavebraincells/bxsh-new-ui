<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Games</title>

<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#00ffa6">

<link rel="icon" href="/images/logo.gif">
<link rel="stylesheet" href="/styles.css">
<script src="/particles.js" defer></script>

<style>
body {
  margin: 0;
  min-height: 100vh;
  background: black;
  color: white;
  font-family: Arial, sans-serif;
  overflow-x: hidden;
}

#particles-js {
  position: fixed;
  inset: 0;
  z-index: -1;
}

#search {
  width: 300px;
  padding: 10px;
  margin: 110px auto 20px auto;
  display: block;
  border-radius: 8px;
  border: none;
  background: #2c2c2c;
  color: white;
  outline: none;
  box-shadow: 0 0 12px rgba(0,255,166,0.4);
}

.games-container {
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  gap: 20px;
  padding: 20px;
}

.game-box {
  width: 180px;
  background: #222;
  border-radius: 10px;
  overflow: hidden;
  cursor: pointer;
  transition: 0.2s;
  box-shadow: 0 0 12px rgba(0,255,166,0.25);
}

.game-box:hover {
  transform: translateY(-5px);
  box-shadow: 0 0 25px rgba(0,255,166,0.8);
}

.game-box img {
  width: 100%;
  height: 120px;
  object-fit: cover;
  background: #111;
}

.overlay {
  padding: 8px;
  text-align: center;
  font-size: 13px;
}

/* fallback image styling */
.fallback {
  background: #111;
  display: flex;
  align-items: center;
  justify-content: center;
  height: 120px;
  font-size: 12px;
  opacity: 0.7;
}
</style>
</head>

<body>

<div id="particles-js"></div>

<header class="topbar">
  <img src="/images/logo.gif" class="logo">
  <nav class="navlinks">
    <a href="/">home</a>
    <a href="/credits.html">cred</a>
    <a href="/games.html">play</a>
    <a href="/apps.html">apps</a>
  </nav>
</header>

<input id="search" placeholder="Search games...">

<div class="games-container" id="container"></div>

<script>
/* =========================
   SAFE GAME DATABASE
   ========================= */

const games = [
  { name: "Slope", img: "images/slope.jpg", link: "/slope.html" },
  { name: "Minecraft", img: "images/minecraft.jpg", link: "/minecraft.html" },
  { name: "Super Mario 64", img: "images/supermario.jpg", link: "/superMARIO64.html" },
  { name: "1v1.lol", img: "images/1v1.jpg", link: "/1v1.html" },
  { name: "Baldi Ultra", img: "images/bdcp.jpg", link: "/bdcp.html" },
  { name: "FNF", img: "images/fnf.jpg", link: "/fnf.html" },
  { name: "-b", img: "images/b.jpg", link: "/b.html" },
  { name: "Five Night's At Epstines", img: "images/fnaE.jpg", link: "/fnaE.html" },
  { name: "Drift Boss", img: "images/db.jpg", link: "/db.html" },
  { name: "Cluster Rush", img: "images/cr.jpg", link: "/cluster.html" },
  { name: "Baldi's Basic's +", img: "images/baldi.jpg", link: "/baldi.html" },
  { name: "Basket Battle", img: "images/bsb.jpg", link: "/basketbattle.html" },
  { name: "Basket Bro's", img: "images/bb.jpg", link: "/basketbros.html" },
  { name: "Bloxorz", img: "images/bx.jpg", link: "/bloxorz.html" },
  { name: "Bridge Race", img: "images/br.jpg", link: "/bridgerace.html" },
  { name: "Candy Crush", img: "images/cc.jpg", link: "/candy.html" },
  { name: "Clash Of Viking's", img: "images/cv.jpg", link: "/clash.html" },
  { name: "Cut The Rope", img: "images/ctr.jpg", link: "/cut.html" },
  { name: "Death Run", img: "images/death.jpg", link: "/deathrun.html" },
  { name: "Five Night's At Winstons", img: "images/fnaW.jpg", link: "/fnaW.html" },
  { name: "School Boy Runaway", img: "images/school.jpg", link: "/school.html" }
];


const container = document.getElementById("container");
const search = document.getElementById("search");


/* =========================
   RENDER SYSTEM
   ========================= */

function render(filter = "") {
  container.innerHTML = "";

  games
    .filter(g => g.name.toLowerCase().includes(filter.toLowerCase()))
    .forEach(g => {

      const box = document.createElement("div");
      box.className = "game-box";

      const link = resolvePath(g.file, "game");
      const img = resolvePath(g.img, "img");

      box.innerHTML = `
        <a href="${link}">
          <div>
            <div class="img-wrap"></div>
            <div class="overlay">${g.name}</div>
          </div>
        </a>
      `;

      const imgEl = createImage(img);
      box.querySelector(".img-wrap").appendChild(imgEl);

      container.appendChild(box);
    });
}

render("");

search.addEventListener("input", e => {
  render(e.target.value);
});

/* =========================
   PARTICLES SAFE INIT
   ========================= */

window.addEventListener("load", () => {
  if (window.particlesJS) {
    particlesJS("particles-js", {
      particles: {
        number: { value: 50 },
        color: { value: "#00ffa6" },
        size: { value: 3 },
        move: { speed: 2 }
      }
    });
  }
});
</script>

</body>
</html>
