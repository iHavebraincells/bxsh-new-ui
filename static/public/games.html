<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Games</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <meta name="theme-color" content="#00ffa6">
  <link rel="icon" href="/images/logo.gif">
  <link href="/styles.css" rel="stylesheet">

  <style>
    body {
      margin: 0;
      min-height: 100vh;
      background: black;
      color: white;
      font-family: Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .games-container {
      display: flex;
      gap: 30px;
      justify-content: center;
      align-items: flex-start;
      flex-wrap: wrap;
      max-width: 1200px;
      padding: 40px;
    }

    .game-box {
      background: #2c2c2c;
      padding: 20px;
      border-radius: 12px;
      text-align: center;
      box-shadow: 0 0 25px rgba(0, 255, 166, 0.7);
      width: 200px;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .game-box:hover {
      transform: translateY(-5px);
      box-shadow: 0 0 35px rgba(0, 255, 166, 1);
    }

    .game-button {
      position: relative;
      cursor: pointer;
    }

    .game-button img {
      width: 100%;
      border-radius: 10px;
      display: block;
    }

.overlay-text {
  position: absolute;
  bottom: 10px;
  left: 10px;
  font-weight: bold;
  text-transform: uppercase;
  text-shadow: 0 0 8px rgba(0,0,0,0.8);
  color: white; /* 👈 THIS */
}

    .linkmaker {
      margin-top: 20px;
      padding: 8px 18px;
      font-size: 14px;
      color: white;
      background: black;
      border-radius: 10px;
      text-decoration: none;
      box-shadow: 0 0 10px rgba(0, 255, 166, 0.6);
      transition: transform 0.15s ease, box-shadow 0.15s ease;
    }

    .linkmaker:hover {
      transform: translateY(-2px);
      box-shadow: 0 0 18px rgba(0, 255, 166, 1);
    }
  </style>
</head>

<body>

  <div class="games-container">

    <!-- slope -->
    <div class="game-box">
      <a href="/slope.html">
        <div class="game-button">
          <img src="images/slope.jpg" alt="Game 1">
          <div class="overlay-text">slope</div>
        </div>
      </a>
    </div>

    <!-- mario -->
    <div class="game-box">
      <a href="/superMARIO64.html">
        <div class="game-button">
          <img src="images/supermario.jpg" alt="Game 2">
          <div class="overlay-text">Super Mario 64</div>
        </div>
      </a>
    </div>

    <!-- minecraft -->
    <div class="game-box">
      <a href="/minecraft.html">
        <div class="game-button">
          <img src="images/minecraft.jpg" alt="Game 3">
          <div class="overlay-text">Minecraft</div>
        </div>
      </a>
    </div>

    <!-- 1v1-->
    <div class="game-box">
      <a href="/1v1.html">
        <div class="game-button">
          <img src="images/1v1.jpg" alt="Game 4">
          <div class="overlay-text">1v1.lol</div>
        </div>
      </a>
    </div>

        <!-- bdcp-->
    <div class="game-box">
      <a href="/bdcp.html">
        <div class="game-button">
          <img src="images/bdcp.jpg" alt="Game 5">
          <div class="overlay-text">Baldi Basic's ULTRA DECOMP</div>
        </div>
      </a>
    </div>
    
        <!--fnf-->
    <div class="game-box">
      <a href="/fnf.html">
        <div class="game-button">
          <img src="images/fnf.jpg" alt="Game 6">
          <div class="overlay-text">Friday Night Funkin</div>
        </div>
      </a>
    </div>
    
        <!---b-->
    <div class="game-box">
      <a href="/b.html">
        <div class="game-button">
          <img src="images/b.jpg" alt="Game 7">
          <div class="overlay-text">-b</div>
        </div>
      </a>
    </div>
    
  <a href="/" class="linkmaker">← Back Home</a>

</body>
</html>
