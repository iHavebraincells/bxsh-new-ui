<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Games</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <meta name="theme-color" content="#00ffa6">
  <link rel="icon" href="/images/logo.gif">
  <link href="/styles.css" rel="stylesheet">

  <style>
    body {
      margin: 0;
      min-height: 100vh;
      background: black;
      color: white;
      font-family: Arial, sans-serif;
      overflow: hidden;
    }

    /* =========================
       MENU LAYOUT (your style)
    ========================== */

    .games-container {
      display: flex;
      gap: 30px;
      justify-content: center;
      align-items: flex-start;
      flex-wrap: wrap;
      max-width: 1200px;
      padding: 40px;
      margin: 0 auto;
      margin-top: 90px;
    }

    .game-box {
      background: #2c2c2c;
      padding: 20px;
      border-radius: 12px;
      text-align: center;
      box-shadow: 0 0 25px rgba(0, 255, 166, 0.7);
      width: 200px;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
      cursor: pointer;
    }

    .game-box:hover {
      transform: translateY(-5px);
      box-shadow: 0 0 35px rgba(0, 255, 166, 1);
    }

    .game-button {
      position: relative;
    }

    .game-button img {
      width: 100%;
      border-radius: 10px;
      display: block;
    }

    .overlay-text {
      position: absolute;
      bottom: 10px;
      left: 10px;
      font-weight: bold;
      text-transform: uppercase;
      text-shadow: 0 0 8px rgba(0,0,0,0.8);
      color: white;
    }

    /* =========================
       IFRAME GAME VIEW
    ========================== */

    #gamePage {
      display: none;
      position: fixed;
      top: 70px;
      left: 0;
      width: 100%;
      height: calc(100vh - 70px);
      background: black;
      z-index: 999;
    }

    #gameFrame {
      width: 100%;
      height: 100%;
      border: none;
    }

    /* =========================
       BACK BUTTON
    ========================== */

    .backbar {
      position: fixed;
      top: 70px;
      left: 0;
      width: 100%;
      height: 40px;
      background: #111;
      display: flex;
      align-items: center;
      padding-left: 15px;
      z-index: 1000;
    }

    .backbtn {
      background: #00ffa6;
      border: none;
      padding: 6px 12px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: bold;
    }

    .backbtn:hover {
      box-shadow: 0 0 12px rgba(0,255,166,0.8);
    }

  </style>
</head>

<body>

  <!-- =========================
       NAVBAR (kept consistent)
  ========================== -->

  <header class="topbar">
    <img src="/images/logo.gif" class="logo" alt="logo">

    <nav class="navlinks">
      <a href="/">home</a>
      <a href="credits.html">cred</a>
      <a href="/games.html">play</a>
      <a href="/apps.html">apps</a>
    </nav>
  </header>

  <!-- =========================
       GAME MENU (your original layout)
  ========================== -->

  <div id="menuPage">

    <div class="games-container">

      <!-- slope -->
      <div class="game-box" onclick="loadGame('/slope.html')">
        <div class="game-button">
          <img src="images/slope.jpg">
          <div class="overlay-text">slope</div>
        </div>
      </div>

      <!-- mario -->
      <div class="game-box" onclick="loadGame('/superMARIO64.html')">
        <div class="game-button">
          <img src="images/supermario.jpg">
          <div class="overlay-text">Super Mario 64</div>
        </div>
      </div>

      <!-- minecraft -->
      <div class="game-box" onclick="loadGame('/minecraft.html')">
        <div class="game-button">
          <img src="images/minecraft.jpg">
          <div class="overlay-text">Minecraft</div>
        </div>
      </div>

      <!-- 1v1 -->
      <div class="game-box" onclick="loadGame('/1v1.html')">
        <div class="game-button">
          <img src="images/1v1.jpg">
          <div class="overlay-text">1v1.lol</div>
        </div>
      </div>

      <!-- baldi -->
      <div class="game-box" onclick="loadGame('/bdcp.html')">
        <div class="game-button">
          <img src="images/bdcp.jpg">
          <div class="overlay-text">Baldi ULTRA DECOMP</div>
        </div>
      </div>

      <!-- fnf -->
      <div class="game-box" onclick="loadGame('/fnf.html')">
        <div class="game-button">
          <img src="images/fnf.jpg">
          <div class="overlay-text">FNF</div>
        </div>
      </div>

      <!-- -b -->
      <div class="game-box" onclick="loadGame('/b.html')">
        <div class="game-button">
          <img src="images/b.jpg">
          <div class="overlay-text">-b</div>
        </div>
      </div>

    </div>

  </div>

  <!-- =========================
       GAME VIEWER
  ========================== -->

  <div id="gamePage">

    <div class="backbar">
      <button class="backbtn" onclick="closeGame()">← Back</button>
    </div>

    <iframe id="gameFrame" allowfullscreen tabindex="0"></iframe>

  </div>

  <!-- =========================
       SCRIPT
  ========================== -->

  <script>
    function loadGame(url) {
      document.getElementById("menuPage").style.display = "none";
      document.getElementById("gamePage").style.display = "block";
      document.getElementById("gameFrame").src = url;
    }

    function closeGame() {
      document.getElementById("menuPage").style.display = "block";
      document.getElementById("gamePage").style.display = "none";
      document.getElementById("gameFrame").src = "";
    }
  </script>

</body>
</html>
