<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Games</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <meta name="theme-color" content="#00ffa6">
  <link rel="icon" href="/images/logo.gif">
  <link rel="stylesheet" href="/styles.css">

  <script src="/particles.js" defer></script>

  <style>
    body {
      margin: 0;
      background: black;
      color: white;
      font-family: Arial, sans-serif;
      overflow: hidden;
    }

    /* PARTICLES */
    #particles-js {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: -1;
    }

    /* MENU */
    #menuPage {
      position: absolute;
      top: 70px;
      left: 0;
      width: 100%;
      height: calc(100vh - 70px);
      overflow-y: auto;
    }

    .games-container {
      display: flex;
      gap: 30px;
      justify-content: center;
      flex-wrap: wrap;
      max-width: 1200px;
      padding: 40px;
      margin: 0 auto;
    }

    .game-box {
      background: #2c2c2c;
      padding: 20px;
      border-radius: 12px;
      text-align: center;
      box-shadow: 0 0 25px rgba(0, 255, 166, 0.7);
      width: 200px;
      transition: 0.2s ease;
      cursor: pointer;
    }

    .game-box:hover {
      transform: translateY(-5px);
      box-shadow: 0 0 35px rgba(0, 255, 166, 1);
    }

    .game-button {
      position: relative;
    }

    .game-button img {
      width: 100%;
      border-radius: 10px;
      display: block;
    }

    .overlay-text {
      position: absolute;
      bottom: 10px;
      left: 10px;
      font-weight: bold;
      text-transform: uppercase;
      text-shadow: 0 0 8px rgba(0,0,0,0.8);
      color: white;
      font-size: 14px;
    }

    /* GAME VIEW */
    #gamePage {
      display: none;
      position: fixed;
      top: 70px;
      left: 0;
      width: 100%;
      height: calc(100vh - 70px);
      background: black;
      z-index: 999;
    }

    #gameFrame {
      width: 100%;
      height: 100%;
      border: none;
    }

    /* BACK BAR */
    .backbar {
      position: fixed;
      top: 70px;
      left: 0;
      width: 100%;
      height: 40px;
      background: #111;
      display: flex;
      align-items: center;
      padding-left: 15px;
      z-index: 1000;
    }

    .backbtn {
      background: #00ffa6;
      border: none;
      padding: 6px 12px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: bold;
    }

    .backbtn:hover {
      box-shadow: 0 0 12px rgba(0,255,166,0.8);
    }
  </style>
</head>

<body>

  <!-- PARTICLES (THIS WAS MISSING) -->
  <div id="particles-js"></div>

  <!-- NAVBAR -->
  <header class="topbar">
    <img src="/images/logo.gif" class="logo" alt="logo">

    <nav class="navlinks">
      <a href="/">home</a>
      <a href="credits.html">cred</a>
      <a href="/games.html">play</a>
      <a href="/apps.html">apps</a>
    </nav>
  </header>

  <!-- MENU -->
  <div id="menuPage">

    <div class="games-container">

      <div class="game-box" onclick="loadGame('/slope.html')">
        <div class="game-button">
          <img src="images/slope.jpg">
          <div class="overlay-text">slope</div>
        </div>
      </div>

      <div class="game-box" onclick="loadGame('/superMARIO64.html')">
        <div class="game-button">
          <img src="images/supermario.jpg">
          <div class="overlay-text">Super Mario 64</div>
        </div>
      </div>

      <div class="game-box" onclick="loadGame('/minecraft.html')">
        <div class="game-button">
          <img src="images/minecraft.jpg">
          <div class="overlay-text">Minecraft</div>
        </div>
      </div>

      <div class="game-box" onclick="loadGame('/1v1.html')">
        <div class="game-button">
          <img src="images/1v1.jpg">
          <div class="overlay-text">1v1.lol</div>
        </div>
      </div>

      <div class="game-box" onclick="loadGame('/bdcp.html')">
        <div class="game-button">
          <img src="images/bdcp.jpg">
          <div class="overlay-text">Baldi ULTRA DECOMP</div>
        </div>
      </div>

      <div class="game-box" onclick="loadGame('/fnf.html')">
        <div class="game-button">
          <img src="images/fnf.jpg">
          <div class="overlay-text">FNF</div>
        </div>
      </div>

      <div class="game-box" onclick="loadGame('/b.html')">
        <div class="game-button">
          <img src="images/b.jpg">
          <div class="overlay-text">-b</div>
        </div>
      </div>

    </div>

  </div>

  <!-- GAME VIEW -->
  <div id="gamePage">

    <iframe id="gameFrame" allowfullscreen tabindex="0"></iframe>

  </div>

  <!-- SCRIPT -->
  <script>
    function loadGame(url) {
      document.getElementById("menuPage").style.display = "none";
      document.getElementById("gamePage").style.display = "block";
      document.getElementById("gameFrame").src = url;
    }

    function closeGame() {
      document.getElementById("menuPage").style.display = "block";
      document.getElementById("gamePage").style.display = "none";
      document.getElementById("gameFrame").src = "";
    }

    document.addEventListener("DOMContentLoaded", () => {
      if (window.particlesJS) {
        particlesJS("particles-js", {
          particles: {
            number: { value: 60 },
            color: { value: "#00ffa6" },
            shape: { type: "circle" },
            opacity: { value: 0.5 },
            size: { value: 3 },
            move: { enable: true, speed: 2 }
          }
        });
      }
    });
  </script>

</body>
</html>
