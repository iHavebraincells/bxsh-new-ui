<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">

  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0, minimal-ui, shrink-to-fit=yes">

  <title>PLSD - Classlink</title>

  <link href="/styles.css" rel="stylesheet">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="/images/thosewhodrinkeggnog.png">

  <meta name="theme-color" content="#00ffa6">
  <meta property="og:title" content="bxsh">
  <meta property="og:image" content="/images/thosewhodrinkeggnog.png">
  <meta property="og:description" content="bxsh unreleased beta">
  <meta name="description" content="bxsh unreleased beta">
  <meta name="msapplication-TileColor" content="#00ffa6">

  <script src="/sys/index.js" defer></script>

  <style>
    #title {
      color: #39FF7E;
      text-shadow: 0 0 10px rgba(57, 255, 126, 0.5);
    }

    /* PARTICLES FIX */
    #particles-js {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: -1;
    }
  </style>
</head>

<body>

<!-- PARTICLES LAYER -->
<div id="particles-js"></div>

<!-- NAVBAR -->
<header class="topbar">
  <img src="/images/thosewhodrinkeggnog.png" class="logo" alt="logo">

  <nav class="navlinks">
    <a href="/">home</a>
    <a href="credits.html">credits</a>
    <a href="/games.html">play</a>
    <a href="/apps.html">apps</a>
  </nav>
</header>

<!-- MAIN -->
<div id="roddyrichheshomebox">
  <div id="main">

    <noscript>enable javascript</noscript>

    <h1 id="title">bxsh</h1>
    <h3>in testing</h3>

    <div id="splash-msg"></div>

    <!-- UV FORM -->
    <form id="uv-form">
      <input id="uv-search-engine"
        value="https://www.google.com/search?hl=en-us&q=%s"
        type="hidden">

      <input id="uv-address"
        type="text"
        placeholder="welcome back"
        class="form__input">
    </form>

  </div>
</div>

<!-- SCRIPTS -->
<script src="/particles.js" defer></script>
<script src="/app.js" defer></script>
<script src="/settings.js" defer></script>
<script src="/panic.js" defer></script>
<script src="/frog/bundle.js" defer></script>
<script src="/frog/config.js?cdn" defer></script>

<script>
document.addEventListener("DOMContentLoaded", () => {

  /* -------------------------
     UV FORM HANDLER
  -------------------------- */
  const form = document.querySelector("#uv-form");
  const input = document.querySelector("#uv-address");

  form.addEventListener("submit", async (event) => {
    event.preventDefault();

    await navigator.serviceWorker.register("/frog/sw.js", {
      scope: __uv$config.prefix,
    });

    let url = input.value.trim();

    if (!url.includes("http")) {
      if (url.includes(".")) url = "http://" + url;
      else url = "https://www.google.com/search?hl=en-us&q=" + url;
    }

    if (url.includes("now.gg")) {
      alert("redirecting...");
      url = "https://nowgg.lol/hub";
    }

    sessionStorage.setItem("encodedUrl", __uv$config.encodeUrl(url));
    location.href = "calculus";
  });

  /* -------------------------
     SPLASH TEXT
  -------------------------- */
  if (typeof randomtextstuff !== "undefined") {
    setInterval(() => {
      document.getElementById("splash-msg").textContent =
        randomtextstuff[Math.floor(Math.random() * randomtextstuff.length)];
    }, 2000);
  }

  /* -------------------------
     PARTICLES INIT
  -------------------------- */
  if (window.particlesJS) {
    particlesJS("particles-js", {
      particles: {
        number: { value: 60 },
        color: { value: "#00ffa6" },
        shape: { type: "circle" },
        opacity: { value: 0.5 },
        size: { value: 3 },
        move: { enable: true, speed: 2 }
      }
    });
  }

  /* -------------------------
     GAME JOIN HANDLER
  -------------------------- */
  const params = new URLSearchParams(window.location.search);
  const joinid = params.get("game");

  if (joinid) {
    location.href = "/share.html?game=" + joinid;
  }

});
</script>

</body>
</html>
